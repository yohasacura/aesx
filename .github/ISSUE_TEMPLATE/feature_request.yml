name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        aesx is deliberately small and ships no third-party code. A proposal that adds a
        dependency, implements cryptography by hand or changes the on-disk format needs a strong
        case; see CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that aesx makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Command-line shape, behaviour, documentation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
