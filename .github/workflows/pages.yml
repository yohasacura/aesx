# Builds the website (site/ plus the documentation rendered from docs/*.md) with GitHub's own
# Jekyll builder and publishes it to GitHub Pages: https://yohasacura.github.io/aesx
#
# A pull request that touches the site only gets a build. main is deployed on every push and once
# more after each release, so the download links pick up the new version. The Release workflow
# also runs rehearsals, which publish nothing: after one of those there is nothing to deploy.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - _config.yml
      - site/**
      - docs/**
      - '*.md'
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Deployments wait for each other in one group. A run that follows a rehearsal or a failed release
# deploys nothing, so it gets a group of its own: waiting in the deployments' group, it would
# take the place of a deployment that is waiting there, and that one would never happen.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || github.event.workflow_run.conclusion != 'success') && 'nothing-to-deploy' || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # After the Release workflow, only for a release: started by a pushed tag, and successful.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
