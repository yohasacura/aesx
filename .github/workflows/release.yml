# Pushing a tag such as v1.2.3 builds aesx for every supported platform on that platform's
# own runner, tests it there, packages it, and publishes a GitHub release with checksums.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # No AppleDouble (._*) entries in tarballs created on macOS.
  COPYFILE_DISABLE: 1

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-15-intel,   rid: osx-x64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Derive version from the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NAME=aesx-$VERSION-${{ matrix.rid }}" >> "$GITHUB_ENV"
          dotnet --version
          dotnet --list-runtimes

      - name: Test on this platform
        run: dotnet test Aesx.sln --configuration Release

      - name: Publish single-file binary
        shell: bash
        run: dotnet publish src/Aesx.Cli/Aesx.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} --output out "-p:Version=$VERSION"

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - out/aesx
          codesign --verify --verbose out/aesx

      - name: Smoke-test the published binary
        shell: bash
        run: |
          set -euxo pipefail
          BIN=out/aesx
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version | grep -F "aesx ${VERSION%%-*}"
          "$BIN" selftest

      - name: Attack and misuse scenarios against the published binary
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/scenarios/run.sh out/aesx

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "stage/$NAME" dist
          cp LICENSE README.md CHANGELOG.md "stage/$NAME/"
          if [ -f out/aesx.exe ]; then
            cp out/aesx.exe "stage/$NAME/"
          else
            cp out/aesx "stage/$NAME/"
            chmod 755 "stage/$NAME/aesx"
          fi

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "stage/$env:NAME" -DestinationPath "dist/$env:NAME.zip"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -C stage -czf "dist/$NAME.tar.gz" "$NAME"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET (to record the toolchain in the notes)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then printf 'aesx %s\n' "$VERSION" > notes.md; fi
          RUNTIME=$(dotnet --list-runtimes | awk '/Microsoft.NETCore.App/ { v = $2 } END { print v }')
          {
            printf '\n---\n\n'
            printf 'Built by GitHub Actions from this tag with .NET SDK %s; the self-contained binaries embed .NET runtime %s. ' "$(dotnet --version)" "$RUNTIME"
            printf 'Verify a download against `SHA256SUMS.txt`: `sha256sum -c SHA256SUMS.txt --ignore-missing` (PowerShell: `Get-FileHash`).\n'
          } >> notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
            *)   PRERELEASE="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "aesx ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            $PRERELEASE
