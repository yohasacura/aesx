# Pushing a tag such as v1.2.3 builds aesx for every supported platform on that platform's
# own runner, tests it there, packages it, and publishes a GitHub release with checksums.
#
# A release tag can be neither moved nor deleted, so everything short of publishing can be
# rehearsed first. A pull request that changes this file or Directory.Build.props rehearses by
# itself (every release pull request does: it sets the version there), and so does
#   gh workflow run release.yml [--ref <branch>] [-f version=1.2.3]
# A rehearsal runs the same build job on the same runners, then the same steps for the checksums
# and the release notes, and stops. It attests nothing and creates no release, and none of its
# jobs can write anything.
name: Release
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Rehearsal ({0})', github.event.pull_request.title || inputs.version || github.ref_name) }}

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Directory.Build.props
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse, such as 1.2.3 (when empty, the one in Directory.Build.props)
        required: false
        type: string

# Each job asks for what it needs; building needs nothing but the source.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # No AppleDouble (._*) entries in tarballs created on macOS.
  COPYFILE_DISABLE: 1

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A release stops at the first failure; a rehearsal goes on, to show all of them.
      fail-fast: ${{ github.event_name == 'push' }}
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-15-intel,   rid: osx-x64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # A release has the version that its tag names. A rehearsal is given one, or takes the one in
      # Directory.Build.props. The two jobs further down run this same step (*version).
      - &version
        name: Derive the version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${REQUESTED:-$(sed -n '/<Version>/{s:.*<Version>\(.*\)</Version>.*:\1:p;q;}' Directory.Build.props)}"
            VERSION="${VERSION#v}"
            pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
            if ! [[ "$VERSION" =~ $pattern ]]; then
              echo "::error::The version to rehearse has to look like 1.2.3 or 1.3.0-rc.1"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Name the archive
        shell: bash
        run: |
          echo "NAME=aesx-$VERSION-${{ matrix.rid }}" >> "$GITHUB_ENV"
          dotnet --version
          dotnet --list-runtimes

      - name: Test on this platform
        run: dotnet test Aesx.sln --configuration Release

      - name: Publish single-file binary
        shell: bash
        run: dotnet publish src/Aesx.Cli/Aesx.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} --output out "-p:Version=$VERSION"

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - out/aesx
          codesign --verify --verbose out/aesx

      - name: Smoke-test the published binary
        shell: bash
        run: |
          set -euxo pipefail
          BIN=out/aesx
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version | grep -F "aesx ${VERSION%%-*}"
          "$BIN" selftest

      - name: Attack and misuse scenarios against the published binary
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/scenarios/run.sh out/aesx

      - name: Finder integration, registered, used and removed again (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        run: AESX_REGISTER_FOR_REAL=1 bash tests/scenarios/finder.sh out/aesx

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "stage/$NAME" dist
          cp LICENSE README.md CHANGELOG.md "stage/$NAME/"
          if [ -f out/aesx.exe ]; then
            cp out/aesx.exe "stage/$NAME/"
          else
            cp out/aesx "stage/$NAME/"
            chmod 755 "stage/$NAME/aesx"
          fi

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "stage/$env:NAME" -DestinationPath "dist/$env:NAME.zip"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -C stage -czf "dist/$NAME.tar.gz" "$NAME"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Only a pushed tag publishes. The steps marked with an anchor (&name) are run by the rehearsal
  # below as well (*name), so that it tries what a release will do.
  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance statement as this workflow run
      attestations: write  # store it with the repository
    steps:
      - &checkout
        name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - &toolchain
        name: Set up .NET (to record the toolchain in the notes)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - *version

      - &binaries
        name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - &checksums
        name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      # A signed statement, kept by GitHub and logged publicly, that these exact files were built
      # by this workflow from this commit: gh attestation verify <file> --repo yohasacura/aesx
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - &notes
        name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION, so the release notes say no more than the version"
            printf 'aesx %s\n' "$VERSION" > notes.md
          fi
          RUNTIME=$(dotnet --list-runtimes | awk '/Microsoft.NETCore.App/ { v = $2 } END { print v }')
          {
            printf '\n---\n\n'
            printf 'Built by GitHub Actions from this tag with .NET SDK %s; the self-contained binaries embed .NET runtime %s. ' "$(dotnet --version)" "$RUNTIME"
            printf 'Verify a download against `SHA256SUMS.txt`: `sha256sum -c SHA256SUMS.txt --ignore-missing` (PowerShell: `Get-FileHash`), '
            printf 'or check where it was built: `gh attestation verify <file> --repo %s`.\n' "$GITHUB_REPOSITORY"
          } >> notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
            *)   PRERELEASE="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "aesx ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            $PRERELEASE

  # What a release does before it publishes, with nothing published and no permission to.
  rehearse:
    name: Rehearsal, nothing published
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *toolchain
      - *version
      - *binaries
      - *checksums
      - *notes

      - name: Say what a release would publish
        run: |
          {
            echo "## Rehearsal of aesx $VERSION"
            echo
            echo "Built, tested and packaged on every release runner. Nothing was attested and no release was created."
            echo
            echo "A release of this commit would publish these files and this list of them (\`SHA256SUMS.txt\`), each with a provenance attestation:"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "and these release notes:"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
