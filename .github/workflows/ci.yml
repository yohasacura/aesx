name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so new package advisories and runtime patches surface even without commits.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    # The job name is a required status check in the ruleset that protects main; renaming it
    # means updating the ruleset (Settings → Rules → Rulesets) in the same change.
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The newest 10.0 SDK, so the runtime bundled into self-contained builds carries the
          # latest security patches; global.json still pins the major version.
          dotnet-version: 10.0.x

      - name: Toolchain versions
        run: |
          dotnet --version
          dotnet --list-runtimes

      - name: Restore (fails on packages with known vulnerabilities)
        run: dotnet restore Aesx.sln

      - name: Build (warnings are errors)
        run: dotnet build Aesx.sln --configuration Release --no-restore

      - name: Formatting
        if: runner.os == 'Linux'
        run: dotnet format Aesx.sln --verify-no-changes --no-restore

      - name: Known vulnerabilities in packages, including transitive ones
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Aesx.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::vulnerable packages found" >&2
            exit 1
          fi

      - name: Test
        run: dotnet test Aesx.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file binary (${{ matrix.rid }})
        run: dotnet publish src/Aesx.Cli/Aesx.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} --output out

      - name: Smoke-test the published binary
        shell: bash
        run: |
          set -euxo pipefail
          BIN=out/aesx
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          ls -la out
          "$BIN" --version
          "$BIN" selftest
          head -c 3000000 /dev/urandom > sample.bin
          printf 'ci-password\n' | "$BIN" encrypt sample.bin --iterations 1000
          printf 'ci-password\n' | "$BIN" decrypt sample.bin.aesx --output sample.out
          cmp sample.bin sample.out
          if printf 'wrong\n' | "$BIN" decrypt sample.bin.aesx --output sample.wrong; then
            echo "a wrong password must fail" >&2
            exit 1
          fi
          [ ! -e sample.wrong ] && [ -z "$(ls sample.wrong.*.part 2>/dev/null)" ]
          "$BIN" info sample.bin.aesx
          printf 'ci-password\n' | "$BIN" verify sample.bin.aesx
          # As a filter: the data arrives on standard input, the password in the environment.
          AESX_PASSWORD=ci-password "$BIN" encrypt - -o piped.aesx --iterations 1000 < sample.bin
          AESX_PASSWORD=ci-password "$BIN" decrypt - -o - < piped.aesx | cmp - sample.bin
          # A folder, there and back.
          mkdir -p tree/sub/empty && printf 'a' > tree/sub/a.txt && cp sample.bin tree/big.bin
          AESX_PASSWORD=ci-password "$BIN" encrypt tree --iterations 1000
          AESX_PASSWORD=ci-password "$BIN" verify tree.folder.aesx
          AESX_PASSWORD=ci-password "$BIN" decrypt tree.folder.aesx --output restored
          diff -r tree restored && [ -d restored/sub/empty ]

      - name: An independent reader (Node.js, no packages) agrees with aesx
        shell: bash
        run: |
          set -euxo pipefail
          READER=tests/interop/aesx-decrypt.mjs
          node --version
          # The test vector printed in docs/FORMAT.md.
          node -e "require('fs').writeFileSync('vector.aesx', Buffer.from('4145535801e8030000000102030405060708090a0b0c0d0e0f010203044a1c50e26e9863c67f7204ef37d91203f95df97cef603b50f223a7388303829043bfe01e82564366ca161811fc7e244395ade905caacee554d63fa', 'hex'))"
          AESX_PASSWORD='aesx test vector' node "$READER" vector.aesx vector.txt
          [ "$(cat vector.txt)" = "The quick brown fox jumps over the lazy dog" ]
          # A file of three chunks and an encrypted folder, both written by aesx just now.
          AESX_PASSWORD=ci-password node "$READER" sample.bin.aesx sample.node
          cmp sample.bin sample.node
          AESX_PASSWORD=ci-password node "$READER" tree.folder.aesx tree.tar
          tar -tf tree.tar | LC_ALL=C sort | tr '\n' ' ' | tee listing.txt
          grep -Fq 'tree/ tree/big.bin tree/sub/ tree/sub/a.txt tree/sub/empty/' listing.txt
          # Damage is rejected, and no output is left behind.
          cp sample.bin.aesx damaged.aesx
          head -c 16 /dev/zero | dd of=damaged.aesx bs=1 seek=2500000 conv=notrunc
          if AESX_PASSWORD=ci-password node "$READER" damaged.aesx damaged.out; then
            echo "a damaged file must fail" >&2
            exit 1
          fi
          [ ! -e damaged.out ]

      - name: Explorer registration, written and removed again (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $aesx = (Resolve-Path out/aesx.exe).Path
          & $aesx register
          if ($LASTEXITCODE -ne 0) { throw "register failed" }
          $class = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\*\shell\aesx\command').DelegateExecute
          $server = (Get-ItemProperty -LiteralPath "HKCU:\Software\Classes\CLSID\$class\LocalServer32").'(default)'
          if ($server -ne ('"' + $aesx + '"')) { throw "the class points at $server" }
          if ((Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\.aesx').'(default)' -ne 'aesx.EncryptedFile') { throw ".aesx is not registered" }
          & $aesx unregister
          if ($LASTEXITCODE -ne 0) { throw "unregister failed" }
          foreach ($key in 'HKCU:\Software\Classes\*\shell\aesx', 'HKCU:\Software\Classes\Directory\shell\aesx', 'HKCU:\Software\Classes\aesx.EncryptedFile', "HKCU:\Software\Classes\CLSID\$class") {
            if (Test-Path -LiteralPath $key) { throw "unregister left $key behind" }
          }

      - name: Attack and misuse scenarios against the published binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          FULL_DIR=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo mkdir -p /mnt/aesx-full
            sudo mount -t tmpfs -o size=1m tmpfs /mnt/aesx-full
            sudo chmod 1777 /mnt/aesx-full
            FULL_DIR=/mnt/aesx-full
          fi
          FULL_DIR="$FULL_DIR" bash tests/scenarios/run.sh out/aesx

      # Registers the published binary in the runner's own account, has macOS perform both
      # services and open and drop files the way the Finder does, and unregisters again.
      - name: Finder integration, registered, used and removed again (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        run: AESX_REGISTER_FOR_REAL=1 SCREENSHOTS=finder-screenshots bash tests/scenarios/finder.sh out/aesx

      - name: Pictures of the Finder's menu and the dialogs (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finder-screenshots
          path: finder-screenshots
          if-no-files-found: ignore
          retention-days: 14
