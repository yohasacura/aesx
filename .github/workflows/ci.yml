name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so new package advisories and runtime patches surface even without commits.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    # The job name is a required status check in the ruleset that protects main; renaming it
    # means updating the ruleset (Settings → Rules → Rulesets) in the same change.
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The newest 10.0 SDK, so the runtime bundled into self-contained builds carries the
          # latest security patches; global.json still pins the major version.
          dotnet-version: 10.0.x

      - name: Toolchain versions
        run: |
          dotnet --version
          dotnet --list-runtimes

      - name: Restore (fails on packages with known vulnerabilities)
        run: dotnet restore Aesx.sln

      - name: Build (warnings are errors)
        run: dotnet build Aesx.sln --configuration Release --no-restore

      - name: Formatting
        if: runner.os == 'Linux'
        run: dotnet format Aesx.sln --verify-no-changes --no-restore

      - name: Known vulnerabilities in packages, including transitive ones
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Aesx.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::vulnerable packages found" >&2
            exit 1
          fi

      - name: Test
        run: dotnet test Aesx.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file binary (${{ matrix.rid }})
        run: dotnet publish src/Aesx.Cli/Aesx.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} --output out

      - name: Smoke-test the published binary
        shell: bash
        run: |
          set -euxo pipefail
          BIN=out/aesx
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          ls -la out
          "$BIN" --version
          "$BIN" selftest
          head -c 3000000 /dev/urandom > sample.bin
          printf 'ci-password\n' | "$BIN" encrypt sample.bin --iterations 1000
          printf 'ci-password\n' | "$BIN" decrypt sample.bin.aesx --output sample.out
          cmp sample.bin sample.out
          if printf 'wrong\n' | "$BIN" decrypt sample.bin.aesx --output sample.wrong; then
            echo "a wrong password must fail" >&2
            exit 1
          fi
          [ ! -e sample.wrong ] && [ -z "$(ls sample.wrong.*.part 2>/dev/null)" ]

      - name: Attack and misuse scenarios against the published binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          FULL_DIR=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo mkdir -p /mnt/aesx-full
            sudo mount -t tmpfs -o size=1m tmpfs /mnt/aesx-full
            sudo chmod 1777 /mnt/aesx-full
            FULL_DIR=/mnt/aesx-full
          fi
          FULL_DIR="$FULL_DIR" bash tests/scenarios/run.sh out/aesx
